os: Visual Studio 2015

# The reference build is done locally with the static Qt 5.12.12 / MinGW 7.3.0
# tool chain (see README.md). OpenSSL is vendored in lmc\src\third_party\openssl,
# so no separate OpenSSL installation is required.

environment:
  matrix:
  - COMPILER: mingw32

init:
  - set TAG_NAME=%APPVEYOR_REPO_TAG_NAME%

build_script:
  - call build_windows.bat %COMPILER%
